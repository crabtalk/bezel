[package]
name = "gallery"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# gpui paints the frame-stat overlay itself; this only opens the door to it.
profiler = ["gpui/profiler"]

# Runs on the host whatever the target is, which is what lets the web build
# ship highlighted samples it could never compile tree-sitter to produce.
[build-dependencies]
syntax.workspace = true
theme.workspace = true

[dependencies]
agent.workspace = true
editor.workspace = true
markdown.workspace = true
motion.workspace = true
theme.workspace = true
ui.workspace = true
# Today's date, in the local timezone — the one thing `date::Calendar` asks its
# host for, because bezel carries no clock. Deliberately a dependency of the
# *app* and never of the library: taking chrono into `ui` would make it
# public API, and a consumer with its own chrono would then have two.
chrono = "0.4"
gpui.workspace = true
web-time.workspace = true

# Only `main.rs` opens a window, and only a native one. Keeping this off the
# wasm target is what lets `web` pick the browser platform's features for
# itself — see the `gpui_web` note in the workspace manifest.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Native-only: alacritty_terminal pulls `home`, which does not compile for
# wasm32, so the terminal crate (and the pattern built on it) sits off the web
# build until that dep is fixed upstream.
terminal.workspace = true
gpui_platform.workspace = true
# The live highlighter. A web build has the build script's table instead.
syntax.workspace = true
