[package]
name = "web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Native too: the `catalog` bin reads the same `TABS` the browser renders, which
# is the whole point — one catalog behind the rail and the website's sidebar.
[dependencies]
gallery.workspace = true
theme.workspace = true

# The `diagrams` and `stats` bins: what the home page draws and counts, at
# build time.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
mermaid.workspace = true
serde_json.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
# gpui-web loads no fonts of its own; these are the only faces the page has.
ui = { workspace = true, features = ["geist-sans", "geist-mono", "geist-weights"] }
console_error_panic_hook = "0.1"
gpui.workspace = true
gpui_web.workspace = true
log = "0.4"
wasm-bindgen.workspace = true
web-sys = { version = "0.3", features = [
    "Location",
    "MessageEvent",
    "UrlSearchParams",
] }
