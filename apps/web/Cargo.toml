[package]
name = "web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Native too: the `catalog` bin reads the same `TABS` the browser renders, which
# is the whole point — one catalog behind the rail and the website's sidebar.
[dependencies]
gallery = { path = "../gallery" }

[target.'cfg(target_family = "wasm")'.dependencies]
theme.workspace = true
ui.workspace = true
console_error_panic_hook = "0.1"
gpui.workspace = true
gpui_web.workspace = true
log = "0.4"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Location", "UrlSearchParams"] }
