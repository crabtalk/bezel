[package]
name = "bezel-icons"
description = "The Lucide icon set, ported into typed gpui-ready SVG constants"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
# Not the workspace README: an inherited `readme` resolves against the workspace
# root, and this crate has one of its own.
readme = "README.md"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
# `assets/` and `src/generated.rs` are gitignored, and cargo packages from the
# VCS listing unless told otherwise. Naming them here is what puts the ported
# glyphs inside the published crate, so a consumer never runs the download.
include = ["src/**/*.rs", "assets/**", "build.rs", "tests/**/*.rs", "README.md"]

[lib]
name = "icons"

[lints]
workspace = true

# One feature per Lucide category, named exactly as Lucide names it. A glyph
# compiles when any category filing it is on, and `full` is the whole set.
#
# Cargo unions features across a graph, so a category a dependency turns on is
# the floor for everyone below it — `ui` needs three, and those three are what
# anything depending on it carries. Within an enabled category the linker still
# drops a glyph the binary never names.
[features]
default = []
full = [
    "accessibility",
    "account",
    "animals",
    "arrows",
    "buildings",
    "charts",
    "communication",
    "connectivity",
    "cursors",
    "design",
    "development",
    "devices",
    "emoji",
    "files",
    "finance",
    "food-beverage",
    "gaming",
    "home",
    "layout",
    "mail",
    "math",
    "medical",
    "multimedia",
    "nature",
    "navigation",
    "notifications",
    "people",
    "photography",
    "science",
    "seasons",
    "security",
    "shapes",
    "shopping",
    "social",
    "sports",
    "sustainability",
    "text",
    "time",
    "tools",
    "transportation",
    "travel",
    "weather",
]
accessibility = []
account = []
animals = []
arrows = []
buildings = []
charts = []
communication = []
connectivity = []
cursors = []
design = []
development = []
devices = []
emoji = []
files = []
finance = []
food-beverage = []
gaming = []
home = []
layout = []
mail = []
math = []
medical = []
multimedia = []
nature = []
navigation = []
notifications = []
people = []
photography = []
science = []
seasons = []
security = []
shapes = []
shopping = []
social = []
sports = []
sustainability = []
text = []
time = []
tools = []
transportation = []
travel = []
weather = []

# The tests name glyphs across the set, so they need it whole. Running them
# alone is `cargo nextest run -p bezel-icons --features full`; the workspace run
# already has it, since the gallery turns `full` on.
[[test]]
name = "icons"
required-features = ["full"]

[dependencies]
gpui.workspace = true

# The parser gpui paints SVGs with: the tests prove a document renders rather
# than merely looking like markup.
[dev-dependencies]
usvg.workspace = true
