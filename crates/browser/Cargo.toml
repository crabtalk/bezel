[package]
name = "bezel-browser"

description = "A platform webview hosted in a gpui window"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
name = "browser"

[lints]
workspace = true

[features]
default = []
# `WebView::with_inspector` and `open_inspector`. On macOS this compiles in
# wry's calls to private WebKit API (`developerExtrasEnabled`, `_inspector`).
inspector = ["wry/devtools"]

[dependencies]
anyhow.workspace = true
gpui.workspace = true
ui.workspace = true
theme.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
async-channel = "2"

[target.'cfg(target_os = "macos")'.dependencies]
wry = { version = "0.57", default-features = false }
raw-window-handle = "0.6"
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-graphics",
    "NSApplication",
    "NSEvent",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSResponder",
    "NSTrackingArea",
    "NSView",
    "NSWindow",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFCGTypes",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGImage",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSDate",
    "NSError",
    "NSGeometry",
    "NSString",
    "NSUUID",
    "NSURL",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "WKNavigation",
    "WKSnapshotConfiguration",
    "WKWebView",
    "WKWebsiteDataRecord",
    "WKWebsiteDataStore",
] }

[target.'cfg(target_os = "windows")'.dependencies]
futures.workspace = true
windows-numerics.workspace = true
webview2-com = "0.39"
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "System", "UI_Composition",
    "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11",
    "Win32_System_Com",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
] }

[target.'cfg(target_family = "wasm")'.dependencies]
raw-window-handle = "0.6"
wasm-bindgen.workspace = true
web-sys = { version = "0.3", features = [
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlIFrameElement",
    "Node",
] }

[dev-dependencies]
gpui_platform.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
