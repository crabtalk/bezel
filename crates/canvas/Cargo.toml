[package]
name = "bezel-canvas"

description = "An infinite canvas for gpui over JSON Canvas — nodes and edges in, a pannable mindmap out"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
name = "canvas"

[lints]
workspace = true

[features]
default = ["gpui"]
gpui = ["dep:editor", "dep:markdown", "dep:theme", "dep:ui", "dep:motion", "dep:gpui", "dep:web-time", "dep:image", "dep:url"]

[dependencies]
url = { workspace = true, optional = true }
image = { workspace = true, optional = true }
editor = { workspace = true, optional = true }
markdown = { workspace = true, optional = true }
theme = { workspace = true, optional = true }
ui = { workspace = true, optional = true }
motion = { workspace = true, optional = true }
gpui = { workspace = true, optional = true }
web-time = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

