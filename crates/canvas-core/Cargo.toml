[package]
name = "bezel-canvas-core"

description = "The bezel canvas document — JSON Canvas and more — its layouts and edits, and a read-only painter"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
name = "canvas_core"

[lints]
workspace = true

# A translator that carries a parser is a feature, so a build that never reads
# its format never compiles the parser.
[features]
mermaid = ["dep:mermaid-rs-renderer"]

[dependencies]
mermaid-rs-renderer = { workspace = true, optional = true }
theme.workspace = true
gpui.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[[test]]
name = "mermaid"
required-features = ["mermaid"]
