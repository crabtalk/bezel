[package]
name = "bezel-ui"
description = "SwiftUI-flavored components for gpui — popovers, menus, buttons, toggles, and loaders"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
name = "ui"

[lints]
workspace = true

[features]
default = []
# Geist (variable), 165 KB. Registering it does not select it — set
# `Theme::font_sans` to "Geist" too, or the platform's own face keeps painting.
geist-sans = []
# Geist Mono (variable), 168 KB. Paired with `Theme::font_mono`.
geist-mono = []
# The static 500/600/700 Geist faces, 375 KB — sans only, there are no mono
# statics. Only the cosmic-text path needs them; a macOS build can drop it.
geist-weights = ["geist-sans"]

[dependencies]
theme.workspace = true
# Four categories cover every glyph the components paint — disclosure chevrons
# and sort arrows, the check and alert marks, the search field, and the square
# a caption button maximises with. Cargo unions features, so these four are the
# floor for anything depending on `ui`.
icons = { workspace = true, features = [
    "arrows",
    "notifications",
    "shapes",
    "text",
] }
motion.workspace = true
gpui.workspace = true
unicode-segmentation = "1"
web-time.workspace = true

# `getrusage` for the process CPU reading in `stats`. Nothing else in the
# library calls the platform.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The same two readings on Windows: `GetProcessTimes` and
# `GetProcessMemoryInfo`.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
# `TestAppContext` and `Window::simulate_next_frame` — a window and a clock
# without a display, which is what lets frame counts be asserted.
gpui = { workspace = true, features = ["test-support"] }
