[package]
name = "bezel-js"
description = "JavaScript's values and their number, string, regex and Date semantics, and d3-format, d3-scale, d3-interpolate, d3-shape's curves, d3-time, d3-time-format and Vega's colour schemes"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
exclude = ["tests/"]
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
name = "js"

[lints]
workspace = true

[dependencies]
chrono.workspace = true

[dev-dependencies]
serde_json.workspace = true

# The clock and the local zone are the page's, through `Date`.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
chrono = { workspace = true, features = ["wasmbind"] }
