[package]
name = "bezel-terminal"

description = "An alacritty-backed terminal emulator and grid view for gpui — bytes in, cells out"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
name = "terminal"

[lints]
workspace = true

[dependencies]
alacritty_terminal.workspace = true
theme.workspace = true
gpui.workspace = true
# Decodes a kitty graphics payload into the BGRA frame gpui paints. The same
# crate gpui decodes its own images with, so the pinned version is shared.
image = "0.25"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
