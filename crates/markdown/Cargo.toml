[package]
name = "bezel-markdown"

description = "A Notion-style block document model for gpui — markdown in, markdown out"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
name = "markdown"

[lints]
workspace = true

# A painted fence that carries a parser is a feature, so a build that never
# shows one never compiles the parser.
[features]
default = ["gpui"]
# Everything that paints. Without it the crate is the document model alone.
gpui = ["dep:gpui", "dep:theme", "dep:ui", "dep:usvg", "dep:rustybuzz"]
# The diagram engine, Mermaid source to SVG. With `gpui` it also paints a
# ```mermaid fence.
mermaid = ["dep:serde", "dep:indexmap", "dep:chrono", "dep:memchr"]

[dependencies]
gpui_shared_string.workspace = true
theme = { workspace = true, optional = true }
ui = { workspace = true, optional = true }
gpui = { workspace = true, optional = true }
pulldown-cmark = { version = "0.13", default-features = false }
serde = { workspace = true, optional = true }
indexmap = { workspace = true, optional = true, features = ["serde"] }
chrono = { workspace = true, optional = true }
memchr = { workspace = true, optional = true }
# The font database and shaping the SVG a fence draws is laid out with.
usvg = { workspace = true, optional = true }
rustybuzz = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
# The parser gpui paints SVG with.
usvg.workspace = true
# `TestAppContext` — a window and a text layout without a display, which is
# what lets a wrapped line be told from one that scrolled.
gpui = { workspace = true, features = ["test-support"] }

[[test]]
name = "mermaid"
required-features = ["mermaid"]

[[test]]
name = "mermaid_fence"
required-features = ["mermaid", "gpui"]
