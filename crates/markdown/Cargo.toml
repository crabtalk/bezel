[package]
name = "bezel-markdown"

description = "A Notion-style block document model for gpui — markdown in, markdown out"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
name = "markdown"

[lints]
workspace = true

# A painted fence that carries a parser is a feature, so a build that never
# shows one never compiles the parser.
[features]
default = ["gpui"]
# Everything that paints. Without it the crate is the document model alone.
gpui = [
    "dep:gpui",
    "dep:theme",
    "dep:ui",
    "dep:usvg",
    "dep:resvg",
    "dep:image",
    "dep:rustybuzz",
]
# A ```mermaid fence painted as its diagram.
mermaid = ["gpui", "dep:mermaid"]

[dependencies]
gpui_shared_string.workspace = true
theme = { workspace = true, optional = true }
ui = { workspace = true, optional = true }
gpui = { workspace = true, optional = true }
pulldown-cmark = { version = "0.13", default-features = false }
mermaid = { workspace = true, optional = true }
# The SVG a fence draws: parsed, laid out and shaped, and rasterized.
usvg = { workspace = true, optional = true }
resvg = { workspace = true, optional = true }
image = { workspace = true, optional = true }
rustybuzz = { workspace = true, optional = true }

[dev-dependencies]
# `TestAppContext` — a window and a text layout without a display, which is
# what lets a wrapped line be told from one that scrolled.
gpui = { workspace = true, features = ["test-support"] }

[[test]]
name = "mermaid_fence"
required-features = ["mermaid"]
