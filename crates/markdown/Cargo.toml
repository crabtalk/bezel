[package]
name = "markdown"

description = "A Notion-style block document model for gpui — markdown in, markdown out"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# The editing surface. It carries `ui` for the slash menu and the link prompt,
# so unlike the reader this gate does lighten the graph — a consumer that only
# paints markdown compiles no popovers.
editor = ["dep:ui"]

[dependencies]
theme.workspace = true
gpui.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
ui = { workspace = true, optional = true }
