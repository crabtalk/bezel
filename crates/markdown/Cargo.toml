[package]
name = "bezel-markdown"

description = "A Notion-style block document model for gpui — markdown in, markdown out"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
name = "markdown"

[lints]
workspace = true

# A painted fence that carries a parser is a feature, so a build that never
# shows one never compiles the parser.
[features]
mermaid = ["dep:canvas-core", "canvas-core/mermaid"]

[dependencies]
theme.workspace = true
ui.workspace = true
gpui.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
canvas-core = { workspace = true, optional = true }

[dev-dependencies]
# `TestAppContext` — a window and a text layout without a display, which is
# what lets a wrapped line be told from one that scrolled.
gpui = { workspace = true, features = ["test-support"] }

[[test]]
name = "mermaid"
required-features = ["mermaid"]
