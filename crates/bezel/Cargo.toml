[package]
name = "bezel"
description = "A SwiftUI-flavored component library for gpui — tokens, motion, and components in one dependency"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["geist-sans", "geist-mono", "geist-weights"]
geist-sans = ["ui/geist-sans"]
geist-mono = ["ui/geist-mono"]
geist-weights = ["ui/geist-weights"]

[dependencies]
agent.workspace = true
motion.workspace = true
theme.workspace = true
# Spelled out rather than inherited: cargo rejects `default-features = false` on
# a workspace dependency that has them, and clearing them in the workspace entry
# would make every other member ask for the fonts back.
ui = { package = "bezel-ui", path = "../ui", version = "0.1.0", default-features = false }
gpui.workspace = true
