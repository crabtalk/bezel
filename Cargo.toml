[workspace]
resolver = "2"
members = ["crates/bezel", "crates/theme", "crates/motion", "crates/ui", "apps/gallery"]

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MIT"
authors = ["clearloop <tianyi.gc@gmail.com>"]
repository = "https://github.com/crabtalk/bezel"
homepage = "https://github.com/crabtalk/bezel"
readme = "README.md"
keywords = ["gpui", "gui", "ui", "components"]
categories = ["gui"]
rust-version = "1.85"

[workspace.dependencies]
bezel = { path = "crates/bezel", version = "0.0.2" }
bezel-theme = { path = "crates/theme", version = "0.0.2" }
bezel-motion = { path = "crates/motion", version = "0.0.2" }
bezel-ui = { path = "crates/ui", version = "0.0.2" }

# gpui by version, sourced from our fork via [patch.crates-io] below. The
# version requirement is what publishing needs (crates.io rejects a bare git
# dep); the patch is what actually builds. When zed publishes a release that
# matches this API, drop the patch and nothing else changes.
gpui = "0.2.2"
# Not published; only the (unpublished) gallery needs it. Must resolve to the
# SAME gpui as the patch below — a second copy in the graph is two
# incompatible type universes.
#
# `font-kit` is NOT optional in practice: without it the text system falls back
# to a handful of bundled faces (no system fonts, no `add_fonts` families), so
# every glyph resolves to notdef — text reserves layout space and paints
# nothing. Add `wayland`/`x11` when we build on Linux.
gpui_platform = { path = "../zed/crates/gpui_platform", features = ["font-kit"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

# Our fork of zed (gpui's home repo), as a sibling checkout: we carry gpui
# patches (`ui::material` needs `Window::paint_backdrop_blur`) that are not
# pushed yet, so a local path is the honest source. Swap to
# `{ git = "https://github.com/crabtalk/zed", rev = "…", version = "=0.2.2" }`
# once the patch branch is pushed — `version` is required there because the
# repo holds more than one package named `gpui`.
[patch.crates-io]
gpui = { path = "../zed/crates/gpui" }

[workspace.lints.rust]
# The objc 0.2 macros expand `cfg(feature = "cargo-clippy")` checks; declare
# the value so rustc's check-cfg pass doesn't warn on every msg_send! site.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("cargo-clippy"))',
] }
