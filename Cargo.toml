[workspace]
resolver = "2"
members = [
    "crates/bezel",
    "crates/theme",
    "crates/motion",
    "crates/agent",
    "crates/ui",
    "crates/syntax",
    "crates/markdown",
    "crates/editor",
    "crates/terminal",
    "apps/gallery",
    "apps/web",
    "apps/hello",
]

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MIT"
authors = ["clearloop <tianyi.gc@gmail.com>"]
repository = "https://github.com/crabtalk/bezel"
homepage = "https://github.com/crabtalk/bezel"
readme = "README.md"
keywords = ["gpui", "gui", "ui", "components"]
categories = ["gui"]
rust-version = "1.85"

[workspace.dependencies]
# The short names are taken on crates.io, so packages publish as `bezel-*`; the
# key here and each crate's `[lib] name` are what the source imports.
bezel = { path = "crates/bezel", version = "0.0.2" }
agent = { package = "bezel-agent", path = "crates/agent", version = "0.0.2" }
theme = { package = "bezel-theme", path = "crates/theme", version = "0.0.2" }
motion = { package = "bezel-motion", path = "crates/motion", version = "0.0.2" }
ui = { package = "bezel-ui", path = "crates/ui", version = "0.0.2" }
markdown = { package = "bezel-markdown", path = "crates/markdown", version = "0.0.2" }
editor = { package = "bezel-editor", path = "crates/editor", version = "0.0.2" }
syntax = { package = "bezel-syntax", path = "crates/syntax", version = "0.0.2" }
terminal = { package = "bezel-terminal", path = "crates/terminal", version = "0.0.2" }

# crates-io
web-time = "1"
alacritty_terminal = "0.26"
tree-sitter = "0.26.9"
tree-sitter-highlight = "0.26"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25"
tree-sitter-json = "0.24"
tree-sitter-typescript = { git = "https://github.com/zed-industries/tree-sitter-typescript", rev = "e2c53597d6a5d9cf7bbe8dccde576fe1e46c5899" }
tree-sitter-go = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-toml-ng = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

# git
gpui = { git = "https://github.com/crabtalk/zed", rev = "247df8fa6225a2ba6ae5044a6d2a0e8de38d396c", version = "0.2.2" }
gpui_platform = { git = "https://github.com/crabtalk/zed", rev = "247df8fa6225a2ba6ae5044a6d2a0e8de38d396c", features = [
    "font-kit",
] }
gpui_web = { git = "https://github.com/crabtalk/zed", rev = "247df8fa6225a2ba6ae5044a6d2a0e8de38d396c", default-features = false }

[workspace.lints.rust]
# The objc 0.2 macros expand `cfg(feature = "cargo-clippy")` checks; declare
# the value so rustc's check-cfg pass doesn't warn on every msg_send! site.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("cargo-clippy"))',
] }
