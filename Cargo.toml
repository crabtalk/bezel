[workspace]
resolver = "2"
members = [
    "crates/bezel",
    "crates/theme",
    "crates/motion",
    "crates/ui",
    "crates/markdown",
    "crates/terminal",
    "apps/gallery",
    "apps/web",
]

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MIT"
authors = ["clearloop <tianyi.gc@gmail.com>"]
repository = "https://github.com/crabtalk/bezel"
homepage = "https://github.com/crabtalk/bezel"
readme = "README.md"
keywords = ["gpui", "gui", "ui", "components"]
categories = ["gui"]
rust-version = "1.85"

[workspace.dependencies]
bezel = { path = "crates/bezel", version = "0.0.2" }
bezel-theme = { path = "crates/theme", version = "0.0.2" }
bezel-motion = { path = "crates/motion", version = "0.0.2" }
bezel-ui = { path = "crates/ui", version = "0.0.2" }
bezel-markdown = { path = "crates/markdown", version = "0.0.2" }
bezel-terminal = { path = "crates/terminal", version = "0.0.2" }

# gpui from our fork by git rev, not from crates.io. The registry release is
# months behind this API and its macOS graph does not even resolve, so a version
# requirement plus `[patch.crates-io]` only ever described a build that could
# not happen — and it made every consumer repeat the patch in their own root
# workspace, because patch sections do not travel through dependencies. A git
# dep resolves for anyone who depends on bezel, with nothing to repeat.
#
# `version` disambiguates: the repo holds a second package named `gpui`, the
# 0.0.0 lint fixture under `tooling/`.
gpui = { git = "https://github.com/crabtalk/zed", rev = "e0b415b4bcffe4a2f05221544a788d482f5f6f50", version = "0.2.2" }
# Same rev as gpui above, deliberately: a second copy of gpui in the graph is
# two incompatible type universes.
#
# `font-kit` is NOT optional in practice: without it the text system falls back
# to a handful of bundled faces (no system fonts, no `add_fonts` families), so
# every glyph resolves to notdef — text reserves layout space and paints
# nothing. Add `wayland`/`x11` when we build on Linux.
gpui_platform = { git = "https://github.com/crabtalk/zed", rev = "e0b415b4bcffe4a2f05221544a788d482f5f6f50", features = [
    "font-kit",
] }
# The browser platform, taken directly rather than through `gpui_platform`,
# which would enable `gpui_web/multithreaded` by default and drag in a
# `wasm_thread` that only builds on nightly. gpui's own browser gallery
# (longbridge/gpui-component) runs single-threaded with empty rustflags, so the
# threaded path buys us nothing but a toolchain pin.
gpui_web = { git = "https://github.com/crabtalk/zed", rev = "e0b415b4bcffe4a2f05221544a788d482f5f6f50", default-features = false }

# `std::time::Instant` panics on wasm32-unknown-unknown ("time not implemented
# on this platform"), and every animation clock in bezel reads one per frame.
# This re-exports std's types natively and reads `performance.now()` on the web,
# so the native build is byte-for-byte what it was.
web-time = "1"

# Terminal emulator state machine (comet pins 0.26 / vte 0.15; the header of
# `crates/terminal/src/emulator.rs` records the API notes for that pair).
alacritty_terminal = "0.26"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[workspace.lints.rust]
# The objc 0.2 macros expand `cfg(feature = "cargo-clippy")` checks; declare
# the value so rustc's check-cfg pass doesn't warn on every msg_send! site.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("cargo-clippy"))',
] }
