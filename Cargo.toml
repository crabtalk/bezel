[workspace]
resolver = "2"
members = [
    "crates/bezel",
    "crates/theme",
    "crates/motion",
    "crates/agent",
    "crates/ui",
    "crates/syntax",
    "crates/markdown",
    "crates/editor",
    "crates/terminal",
    "apps/gallery",
    "apps/web",
    "apps/hello",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
authors = ["clearloop <tianyi.gc@gmail.com>"]
repository = "https://github.com/crabtalk/bezel"
homepage = "https://github.com/crabtalk/bezel"
readme = "README.md"
keywords = ["gpui", "gui", "ui", "components"]
categories = ["gui"]
rust-version = "1.85"

[workspace.dependencies]
# The short names are taken on crates.io, so packages publish as `bezel-*`; the
# key here and each crate's `[lib] name` are what the source imports.
bezel = { path = "crates/bezel", version = "0.1.1" }
agent = { package = "bezel-agent", path = "crates/agent", version = "0.1.1" }
theme = { package = "bezel-theme", path = "crates/theme", version = "0.1.1" }
motion = { package = "bezel-motion", path = "crates/motion", version = "0.1.1" }
ui = { package = "bezel-ui", path = "crates/ui", version = "0.1.1" }
markdown = { package = "bezel-markdown", path = "crates/markdown", version = "0.1.1" }
editor = { package = "bezel-editor", path = "crates/editor", version = "0.1.1" }
syntax = { package = "bezel-syntax", path = "crates/syntax", version = "0.1.1" }
terminal = { package = "bezel-terminal", path = "crates/terminal", version = "0.1.1" }

# crates-io
web-time = "1"
alacritty_terminal = "0.26"
tree-sitter = "0.26.9"
tree-sitter-highlight = "0.26"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25"
tree-sitter-json = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-toml-ng = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

# Our zed fork, published from crabtalk/zed; the keys are what the source imports.
gpui = { package = "bezel-gpui", version = "0.3.3" }
gpui_platform = { package = "bezel-gpui-platform", version = "0.3.3", features = [
    "font-kit",
] }
gpui_web = { package = "bezel-gpui-web", version = "0.3.3" }

[workspace.lints.rust]
# The objc 0.2 macros expand `cfg(feature = "cargo-clippy")` checks; declare
# the value so rustc's check-cfg pass doesn't warn on every msg_send! site.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("cargo-clippy"))',
] }
