name: ci

# Branches reach `main` through a pull request, so `pull_request` covers them —
# pushing to a branch that has one open would otherwise run everything twice.
# `push` is left for `main` itself, which is merged into rather than pushed.
on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: only the tip matters.
# Keyed on the source branch, since a pull request's own ref is not it.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # One platform, the cheapest runner. A `#[cfg]` arm clippy never compiles is
  # never linted, so the windows-gated code is read by rustc on its own job and
  # by nothing else — `-D warnings` there is what keeps it honest.
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo .github/scripts/linux-deps
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  # The two platforms nobody here builds on. macOS is the development machine —
  # it runs the suite before a push, and it is the one place the glass actually
  # paints — so a runner for it would be re-running what was just run.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - if: runner.os == 'Linux'
        run: sudo .github/scripts/linux-deps
      # nextest builds what it runs, so there is no separate build step; the
      # one platform that lints `--all-targets` covers what a test run misses.
      #
      # No fail-fast: one platform-specific failure hiding the rest of the
      # suite is not a report anyone can act on.
      - run: cargo nextest run --workspace --no-fail-fast

  # The gallery ships to the browser, and wasm fails in ways no native build
  # sees — `std::time::Instant` panics there, and a missing renderer feature
  # only shows up at this step.
  wasm:
    name: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: sudo .github/scripts/linux-deps
      - run: cargo build -p web --lib --target wasm32-unknown-unknown
