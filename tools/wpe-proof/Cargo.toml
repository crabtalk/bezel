[package]
name = "bezel-wpe-proof"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
integration = ["dep:gpui", "dep:gpui_platform", "dep:libc", "dep:anyhow", "dep:serde_json", "dep:image", "dep:tracing"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
image = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
gpui = { workspace = true, features = ["test-support"], optional = true }
gpui_platform = { workspace = true, features = ["test-support"], optional = true }

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration"]

[[test]]
name = "production"
path = "tests/production.rs"
required-features = ["integration"]
